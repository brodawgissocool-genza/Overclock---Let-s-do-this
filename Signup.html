<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overclock - Create Account</title>
    <style>
        body { 
            background: #0d0d11; 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .signup-card { 
            background: #16161c; 
            padding: 40px; 
            border-radius: 12px; 
            border: 1px solid #252530; 
            width: 100%; 
            max-width: 360px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h2 { margin-top: 0; color: #fff; font-size: 24px; letter-spacing: 0.5px; }
        p { color: #8a8a9e; font-size: 14px; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #a5a5b5; font-size: 13px; }
        input { 
            width: 100%; 
            padding: 12px; 
            box-sizing: border-box; 
            background: #0d0d11; 
            border: 1px solid #252530; 
            color: #fff; 
            border-radius: 6px; 
            font-size: 15px;
        }
        input:focus { border-color: #007acc; outline: none; }
        button { 
            width: 100%; 
            background: #007acc; 
            color: white; 
            border: none; 
            padding: 14px; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: 16px;
            cursor: pointer; 
            transition: background 0.2s;
            margin-top: 10px;
        }
        button:hover { background: #0098ff; }
        .status-msg { margin-top: 15px; font-size: 14px; text-align: center; display: none; }
    </style>
</head>
<body>

    <div class="signup-card">
        <h2>Join Overclock</h2>
        <p>Create your custom launcher profile variables.</p>
        
        <form onsubmit="submitForm(event)">
            <div class="form-group">
                <label for="userInput">Username</label>
                <input type="text" id="userInput" placeholder="e.g. OverclockGamer" required>
            </div>
            <div class="form-group">
                <label for="passInput">Numeric Password</label>
                <input type="number" id="passInput" placeholder="Numbers only (e.g. 884422)" required>
            </div>
            <button type="submit">Register Profile</button>
        </form>
        
        <div id="status" class="status-msg"></div>
    </div>

    <!-- Load the Supabase JavaScript Library SDK -->
    <script src="https://jsdelivr.net"></script>
    
    <script>
        // FIXED URL CONTEXT STRINGS - Replace with your real Supabase URL endpoint
        const SUPABASE_URL = "https://ctjkxyrdehtlrcdtimit.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_Yq4NUZWeSCJf1Xxy495opg__2UpmkWt";
        
        // FIXED INITIALIZER: Calls the global supabase object from the CDN correctly
        const dbClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function registerUser(typedUsername, typedPassword) {
            const statusBox = document.getElementById("status");
            
            const dynamicInt8Token = Math.floor(Math.random() * 8000000000000000) + 1000000000000000;
            const dynamicUuidEmail = crypto.randomUUID(); 

            statusBox.style.display = "block";
            statusBox.style.color = "#a5a5b5";
            statusBox.innerText = "Transmitting registration values...";

            const { data, error } = await dbClient
                .from('Profiles') 
                .insert([
                    { 
                        username: typedUsername,              
                        password: parseInt(typedPassword), 
                        userToken: dynamicInt8Token,         
                        email: dynamicUuidEmail            
                    }
                ])
                .select();

            if (error) {
                console.error("Database Insertion Failure:", error.message);
                statusBox.style.color = "#ff4d4d";
                statusBox.innerText = "Error: " + error.message;
                return false;
            }

            statusBox.style.color = "#2ecc71";
            statusBox.innerText = "Success! Storing session and redirecting...";
            
            localStorage.setItem("overclock_session_token", dynamicInt8Token);
            
            setTimeout(() => {
                window.location.href = "index.html"; 
            }, 1500);
            
            return true;
        }

        function submitForm(event) {
            event.preventDefault(); 
            const usernameValue = document.getElementById("userInput").value.trim();
            const passwordValue = document.getElementById("passInput").value;
            
            registerUser(usernameValue, passwordValue);
        }
    </script>
</body>
</html>
